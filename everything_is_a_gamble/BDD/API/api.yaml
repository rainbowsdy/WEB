openapi: 3.0.3
info:
  title: Velov API
  version: 1.1.0

servers:
  - url: http://localhost:3001

paths:

  /register:
    post:
      summary: Inscription utilisateur
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: "ugo"
              password: "1234"
      responses:
        '200':
          description: Utilisateur créé
          content:
            application/json:
              example:
                user_id: 1
                username: "ugo"

  /login:
    post:
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: "ugo"
              password: "1234"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              example:
                username: "ugo"
                money: 1000
        '401':
          description: Erreur auth
          content:
            application/json:
              example:
                error: "Mot de passe incorrect"

  /update_money:
    post:
      summary: Mise à jour du solde
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: "ugo"
              money: 1200
      responses:
        '200':
          description: Solde mis à jour
          content:
            application/json:
              example:
                money: 1200

  /nb_total:
    get:
      summary: Total vélos
      responses:
        '200':
          content:
            application/json:
              example:
                - nom: "République"
                  num_station: 1234
                  total_velos: 15

  /nb_elec:
    get:
      summary: Vélos électriques
      responses:
        '200':
          content:
            application/json:
              example:
                - nom: "Bellecour"
                  num_station: 5678
                  velo_elec: 5

  /nb_normal:
    get:
      summary: Vélos normaux
      parameters:
        - name: num_station
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                - nom: "Part-Dieu"
                  num_station: 9101
                  velo_normal: 10

  /info_statique:
    get:
      summary: Infos stations
      responses:
        '200':
          content:
            application/json:
              example:
                - id_station: 1
                  nom: "Bellecour"
                  adresse: "Lyon"

  /stations/{id}/{type}:
    get:
      summary: Historique station
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [normal, elec, total]
      responses:
        '200':
          content:
            application/json:
              example:
                nom: "Bellecour"
                num_station: 123
                historique:
                  - horodatage: "2024-01-01T10:00:00Z"
                    velo_normal: 5
                  - horodatage: "2024-01-01T11:00:00Z"
                    velo_normal: 7